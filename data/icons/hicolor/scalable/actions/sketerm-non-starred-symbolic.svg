<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Hollow bookmark star ("not bookmarked"). Bundled because
       Adwaita's non-starred-symbolic lives under symbolic/status/,
       which non-Adwaita theme chains never reach, and GTK then draws
       a blank blob in its place. Even-odd fill keeps it a pure filled
       path, so GTK's symbolic recolouring applies cleanly. -->
