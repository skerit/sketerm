<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Two panes side by side (left | right) — the result of a
       horizontal split. Monochrome symbolic icon: GTK recolours the
       fill to the menu foreground via the -symbolic name. -->
  <g fill="#2e3436">
    <rect x="1.5" y="3" width="5.5" height="10" rx="1"/>
    <rect x="9" y="3" width="5.5" height="10" rx="1"/>
  </g>
</svg>
