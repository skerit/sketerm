# sketerm sample config — copy to ~/.config/sketerm/config.conf
# Format: key = value, one per line. `#` at line start = comment.
# Hex colors (#RRGGBB or #RRGGBBAA) are supported as values.

# Font
# font           = /usr/share/fonts/Hack/Hack-Regular.ttf
# font_size      = 14
# Extra pixels per cell row for line spacing. 0 = font's natural
# metric. Negative tightens; clamped so glyphs still fit. Useful
# for fonts that feel cramped (e.g. add 2-4 px) or to maximise
# vertical density on small screens.
# line_pad_px    = 0
# OpenType features for shaping, space/comma separated. CSS/kitty
# syntax: +feat enables, -feat disables, feat=N selects alternates.
# e.g. disable ligatures' calt but keep a stylistic set:
# font_features  = -calt +ss01 zero

# Colors
# default_fg     = #eaeaea
# default_bg     = #1a1a1a
# cursor_color   = #ffffff

# Light/dark variants. With auto_theme on, the `light.` / `dark.`
# prefix overrides the flat colour of the same name while the system
# is in that mode; anything left unset keeps the flat value. Both
# variants live in every profile, so a per-pane profile survives a
# theme switch. Overridable keys: default_fg, default_bg,
# cursor_color, cursor_color_default, scheme, palette.
# With auto_theme on, the Preferences > Colors page edits these two
# sets (one group each) instead of the flat keys above, because the
# flat ones are not what renders then.
# light.default_fg = #1a1a1a
# light.default_bg = #fdf6e3
# light.scheme     = solarized_light
# dark.default_fg  = #eeeeee
# dark.default_bg  = #002b36
# dark.scheme      = solarized_dark

# Cursor: shape = block | underline | bar
# cursor_shape   = block
# cursor_blink   = true
# Half-cycle in ms (full blink = 2 × this). xterm default 500.
# cursor_blink_ms = 500
# Animated trail stretching from the cursor's old cell to its new one,
# drawn in the cursor colour. Off by default: it redraws at 60 fps
# while a jump is in flight (it stops dead once the trail lands).
# cursor_trail    = false
# How long a trail takes to catch up, and a hard cap on how long it
# can linger. 30..2000.
# cursor_trail_ms = 300

# Colour space that antialiased glyph coverage is blended in.
#   native           what every terminal has always done: blend the
#                    sRGB-encoded values directly. Wrong physically -
#                    a half-covered edge pixel gets ~21% of the light
#                    it should - but it is what fonts were tuned
#                    against, so it is the default and nothing changes
#                    unless you set this.
#   linear           blend in linear light. Removes the dark fringe
#                    that complementary colours (red on green) get
#                    along glyph edges, but changes apparent weight:
#                    dark text thins, light text thickens.
#   linear_corrected same, with a correction that puts the perceived
#                    weight back where native had it. `linear-corrected`
#                    also parses, so a value copied from ghostty's docs
#                    works as-is.
# The two linear modes render through an offscreen target; native
# draws straight to the framebuffer and costs nothing.
# text_blending   = native

# Layout
# padding        = 6.0
# scrollback     = 10000

# Shell + child env
# shell          = /usr/bin/fish
# term           = xterm-256color
# color_term     = truecolor
#
# For tools that gate image preview on $TERM (yazi, lf, btop, chafa,
# viu, neofetch, etc.), set:
#   term = xterm-kitty
# This makes them use the Kitty graphics protocol — sketerm supports
# it natively. Sixel users keep the default (xterm-256color); DA1
# advertises sixel and most sixel-aware tools accept that.

# Behaviour
# bracketed_paste    = true
# modify_other_keys  = 0   # 0 = off, 1 = basic, 2 = full

# Rendering
# ligatures          = true   # HarfBuzz shaping for Fira Code etc.
# bidi               = true   # Hebrew/Arabic/Indic via fribidi (LTR
                              # rows skip the bidi cost automatically)
# auto_theme         = true   # follow Adwaita dark/light at runtime

# Bell
# bell_audible       = false  # add a system beep on BEL/notify
# bell_visible       = true   # flash the cell briefly on BEL
# bell_urgent        = true   # mark non-focused tabs needs-attention

# Window
# tab_position           = top         # top | bottom
# close_button_on_tab    = true
# always_on_top          = false       # gtk_window_set_keep_above
# new_tab_after_current  = false       # insert new tabs after focused vs. at end
# confirm_close          = multiple    # never | multiple | always

# Mouse
# mouse_autohide          = true       # hide cursor while typing
# copy_on_selection       = false      # copy to PRIMARY on selection-end
# clear_select_on_copy    = false      # drop selection after Ctrl+Shift+C
# disable_mouse_paste     = false      # disable middle-click paste
# disable_mousewheel_zoom = false      # don't let Ctrl+wheel resize font
# link_single_click       = false      # OSC 8 links open without Ctrl
# Rebindable click actions (when apps aren't capturing the mouse).
# Values: menu | paste_primary | paste_clipboard | none
# mouse_middle_click      = paste_primary
# mouse_right_click       = menu        # PuTTY-style: paste_clipboard
#
# Keyboard hints (Ctrl+Shift+E): activating a path hint whose file
# exists locally opens it in an editor at the right line (compiler
# errors -> editor in one keystroke). Either a {file}/{line}/{col}
# template or a bare command that takes `+line file`. Unset =
# $EDITOR/$VISUAL; no editor at all = copy to clipboard as before.
# hint_editor             = nvim
# hint_editor             = code -g {file}:{line}:{col}
#
# Inside a tmux/vim/htop session that has mouse-tracking on, sketerm
# forwards every click to the running app — that's why drag-select
# does nothing. Hold Shift while dragging to override (xterm/kitty
# convention). Ctrl+Shift+A copies the entire visible screen if the
# app won't let go of the mouse at all.

# Clipboard over mosh + tmux (OSC 52)
# OSC 52 is the escape sequence apps use to put text on YOUR system
# clipboard from inside a remote session. Two stacked filters can
# silently drop it:
#   1. tmux only emits OSC 52 to the outer terminal when it believes
#      the outer terminal supports it. sketerm's default $TERM is
#      xterm-256color, which doesn't advertise the `Ms` cap. Add to
#      your ~/.tmux.conf:
#          set -as terminal-features ',*:clipboard'
#      (tmux ≥ 3.2). Older tmux: `set-option -ag terminal-overrides
#      ',*:Ms=\\E]52;%p1%s;%p2%s\\007'`.
#   2. mosh strips most OSC sequences. Recent mosh (≥ 1.4) supports
#      OSC 52 but only with `MOSH_OSC52=1` set on the *server* side
#      before mosh-server starts (e.g. via your shell rc), or with a
#      build that has it on by default. `mosh --version` will tell
#      you. Without this, no terminal will ever see OSC 52 from
#      inside a mosh session — sketerm receives nothing to forward.
#
# OSC 52 READ queries (an app asking for your clipboard contents)
# are denied by default: anything running on the PTY — including
# remote programs over ssh — could silently exfiltrate whatever you
# last copied. Enable only if you use a tool that needs it (e.g.
# vim's clipboard=unnamed over ssh):
# clipboard_read          = allow      # default: deny

# Search
# search_case_sensitive   = false      # default for the search box

# Bold rendering
# allow_bold              = true       # honour bold attr at all
# bold_is_bright          = true       # bold lifts palette 0..7 to 8..15

# Custom keybindings
# Override the default action ↔ accelerator mapping per action. Empty
# value unbinds. Action names are stable; format is GTK accelerator
# style. Stack modifiers in any order. See defaults below for the
# full list of action names. (You can also rebind via the prefs UI.)
# keybind.new_tab               = <Control><Shift>t
# keybind.close_tab             = <Control><Shift>w
# keybind.split_h               = <Control><Shift>d
# keybind.split_v               = <Control><Shift>r
# keybind.search_open           = <Control><Shift>f
# keybind.paste_clipboard       = <Control><Shift>v
# keybind.copy_screen           = <Control><Shift>a
# keybind.interrupt_or_copy     = <Control><Shift>c
# keybind.clear_and_scrollback  = <Control><Shift>k
# keybind.save_layout           = <Control><Shift>s
# keybind.save_layout_as        = <Control><Shift><Alt>s
# keybind.save_default_layout   =
# Saves to $XDG_STATE_HOME/sketerm/default.json. Auto-loaded on
# every cold start when neither --layout nor --restore is given.
# keybind.toggle_pin_tab        = <Control><Shift>p
# keybind.toggle_tab_bar        =
# Show / hide the tab bar entirely. Useful when running with a
# single tab — the bar's vertical space goes back to content.
# keybind.reload_config         =
# Re-read this file from disk + apply live (no restart needed).
# Re-reads whichever file the process started from: an active
# --config <path> override, else the XDG search path. Useful while
# iterating on theme / palette tweaks.
# keybind.prompt_prev           = <Control><Shift>Up
# keybind.prompt_next           = <Control><Shift>Down
# keybind.pane_prev             = <Control><Shift>Left
# keybind.pane_next             = <Control><Shift>Right
# keybind.next_tab              = <Control>Tab
# keybind.prev_tab              = <Control><Shift>Tab
# keybind.font_inc              = <Control>plus
# keybind.font_dec              = <Control>minus
# keybind.font_reset            = <Control>0
# keybind.prefs_open            = <Control>comma
# keybind.scrollback_page_up    = <Shift>Page_Up
# keybind.scrollback_page_down  = <Shift>Page_Down
# keybind.scrollback_top        = <Control><Shift>Home
# keybind.scrollback_bottom     = <Control><Shift>End
# keybind.broadcast_cycle       = <Control><Shift>g
# keybind.restore_closed_tab    = <Control><Shift>z
# keybind.duplicate_tab         =
# Spawn a new tab inheriting the focused pane's cwd + active profile.
# Multi-pane tabs round-trip through the layout-spec pipeline so
# splits are preserved.
# keybind.copy_selection        =
# keybind.copy_scrollback       =
# Like copy_screen, but extracts the entire scrollback ring + active
# screen. Soft-wraps preserved as logical lines.
# keybind.clear_scrollback      =
# Wipe the scrollback ring without disturbing the visible screen
# (vs. clear_and_scrollback which clears both).
# keybind.copy                  = (no default — usually use interrupt_or_copy)
# keybind.paste                 = (no default — usually use paste_clipboard)

# Profiles
# Every pane-level key (font*, colors, shell, term, scrollback,
# padding, line_pad_px, custom_shader, …) belongs to a PROFILE. The
# top-level keys above form the built-in "default" profile; each
# `[profile.<name>]` section defines another COMPLETE profile, seeded
# from the default settings written above it, then overridden by the
# section's keys. There is no inheritance after that point — editing
# the default later does not change other profiles' explicit values.
# Splits inherit the focused pane's profile; "Apply Profile to Pane"
# (right-click / palette) re-styles a live pane; the Preferences
# "Profiles" page edits/creates/deletes them visually.
# `default_profile` selects the profile new panes spawn with; empty
# (or "default") = the default settings.
# default_profile = dev
#
# [profile.dev]
# shell = /usr/bin/fish
# scheme = solarized_dark
# font_size = 14
# scrollback = 50000
#
# [profile.prod]
# shell = /usr/bin/bash
# login_shell = true
# term = xterm-256color
# scheme = monokai
#
# [profile.retro]
# scheme = gruvbox_dark
# custom_shader = ~/.config/sketerm/crt.glsl   # per-profile shader;
#                                              # right-click > "Pane
#                                              # Shader…" sets one per
#                                              # pane ad hoc

# Per-operating-system overrides
# A `[platform.<name>]` section holds lines that only apply when
# <name> is the OS this build runs on: `linux` or `macos`. Anything
# valid at the top level is valid inside one (pane-level keys,
# app-level keys, keybind./symbol_map./… families) — it is the top
# level made conditional, applied INLINE at the point it appears.
# Two consequences worth knowing:
#   * It edits the default profile, never a named one. Put the
#     section BEFORE your `[profile.*]` sections and the ordinary
#     seeding rule carries its values into them.
#   * Keys for the OTHER platform are still checked at load, so a
#     typo is reported on the machine you are sitting at.
# The Preferences dialog keeps these sections verbatim, but also
# writes this platform's overridden values at the top level — see
# docs/config.md before mixing the two.
#
# [platform.macos]
# font_family  = SF Mono
# keybind.copy = <Meta>c
#
# [platform.linux]
# font_family  = JetBrains Mono
# keybind.copy = <Control><Shift>c

# Mux domains
# Each `[domain.<name>]` section names a remote sketerm-mux endpoint.
# The command palette gains a "New Tab on <name>" entry, and
# `sketerm mux <name>` / `sketerm ssh <name>` resolve the name.
# transport: auto (default) probes roaming UDP, then falls back to the
# SSH pipe. Set ssh or udp to force one transport. UDP uses a one-time
# SSH bootstrap then mosh-style encrypted datagrams.
#
# [domain.devbox]
# host = skerit@192.168.1.2
# transport = udp
#
# [domain.work]
# host = build.example.com

# UDP transport port range (mosh-style; pin when a firewall sits in
# front of the remote host and open these ports for UDP):
# mux_udp_port_range = 60000:61000

# URL auto-detection
# auto_url_detect         = true       # underline plain http(s) URLs

# Window background opacity
# 1.0 = fully opaque (default). Lower values let the compositor blend
# behind the window. Wayland-only; X11 ignores. Blur is the user's
# job via compositor window rules (KWin / Mutter Tweaks).
# background_opacity      = 1.0

# Inactive pane dimming
# When you have multiple split panes, only the focused one runs at
# full brightness. Unfocused panes are dimmed by a uniform post-
# process over the whole pane, so every colour stays true (just
# darker) instead of per-cell multiplies that shift hues.
# inactive_darken         = 0.20       # darken unfocused panes (0..1)
# inactive_desaturate     = 0.00       # fade toward gray (0..1)

# Overlay scrollbar
# A thin proportional scrollbar drawn INSIDE the pane (no widget, no
# stolen column). Drag the thumb to scroll, click the trough to page
# toward the click. It stays draggable while a TUI holds the mouse:
# only presses actually on the track are taken, everything else still
# reaches the app.
# scrollbar               = auto       # never | auto | always
                                       # auto = shown once there is
                                       # scrollback; there is no timed
                                       # fade-out
# scrollbar_width         = 4.0        # track width, pixels (0 = off)
# scrollbar_trough_color        = #8080802e
# scrollbar_thumb_color         = #8080804d   # at the live bottom
# scrollbar_thumb_active_color  = #668cd9b3   # while scrolled back

# Split separators (the gap between two panes)
# pane_gap                = 4.0        # separator thickness, logical px.
                                       # Keep a multiple of 4: at 1.25 /
                                       # 1.5 / 1.75 scaling an odd value
                                       # pushes a pane off the device-
                                       # pixel grid and GPU offload then
                                       # rejects every frame.
# pane_gap_color          = #353535

# Pane borders + corners (per profile — put these in a
# [profile.<name>] section to mark that profile's panes)
# pane_border_width        = 2.0       # pixels, 0 = no border
# pane_border_color_active = #668cd9bf # focused pane
# pane_border_color        = #00000000 # unfocused (alpha 0 = none)
# pane_corner_radius       = 0.0       # rounds the pane's own corners;
                                       # cut from the composited pane, so
                                       # the corners show what is behind

# Quake mode (`sketerm --toggle` raises / hides the running instance)
# Off by default: with it on, the primary window is sized from the
# monitor instead of the 1000x700 default.
# quake_enabled           = false
# quake_monitor           = active     # active | primary | <index> | DP-1
                                       # GTK4 has no primary-monitor
                                       # concept, so `primary` means the
                                       # display's first monitor
# quake_edge              = top        # top | bottom | left | right.
                                       # ADVISORY: GTK4 exposes no window
                                       # positioning on any backend and
                                       # Wayland forbids self-placement,
                                       # so the compositor decides where
                                       # the window lands. Use a KWin /
                                       # Mutter window rule to pin it.
# quake_width_percent     = 100.0      # of the target monitor
# quake_height_percent    = 50.0       # 100 + 100 = fullscreen on that
                                       # monitor, which IS placed exactly

# Minimum text contrast
# Enforce a minimum WCAG contrast ratio (1..21) between text and its
# cell background; text below it snaps to white or black. Rescues
# unreadable color combos some TUIs emit. 1.0 = off.
# minimum_contrast        = 1.0

# Per-pane title bar (Terminator-style)
# show_titlebar           = false      # show OSC 0/1/2 title above each pane
# show_tab_bar            = true       # AdwTabBar above the panes — set
                                       # false to start with the bar hidden;
                                       # toggle_tab_bar action flips runtime
# title_active_fg         = #ffffff    # active pane: foreground
# title_active_bg         = #c80003    # active pane: background (red)
# title_inactive_fg       = #000000    # other panes: foreground
# title_inactive_bg       = #c0bebf    # other panes: background (grey)

# Title format
# What a tab label and the window title actually SAY. Placeholders are
# {{ NAME }}, case-insensitive, with `||` for a fallback chain:
#
#   title           OSC 0/2 title, as the application set it
#   program         foreground process on the pty (nvim, ssh, bash)
#   absolute_path   working directory        (/home/you/src/sketerm)
#   relative_path   the same, $HOME as ~     (~/src/sketerm)
#   columns lines   current grid size
#   index           1-based tab position
#   session         mux session name (empty for a plain local pane)
#   profile         active profile name (empty on Default)
#   zoom            "zoom" while the pane is zoomed, otherwise empty
#
# A placeholder with no value takes an adjacent separator with it, so
# "{{ PROGRAM }} - {{ RELATIVE_PATH }}" renders "nvim", not "nvim - ",
# when the directory is unknown. An unknown placeholder is reported at
# load time and the default is used instead.
#
# tab_title_template      = {{ TITLE }}
# window_title_template   =            # empty = the window is just "sketerm"
#
# Examples:
# tab_title_template      = {{ INDEX }}: {{ PROGRAM || TITLE }}
# tab_title_template      = {{ TITLE || RELATIVE_PATH }}
# window_title_template   = {{ PROGRAM }} - {{ RELATIVE_PATH }}

# Behaviour extras
# scroll_on_output       = false       # snap to bottom on any output
# smart_copy             = true        # Ctrl+Shift+C with no selection forwards Ctrl+C
# login_shell            = false       # prepend `-` to argv[0]
# cursor_color_default   = true        # cursor uses fg color (ignore cursor_color)
# word_chars             = -_.,/?:@&=+%~
# exit_action            = close       # close | restart | hold

# Live config reload: this file is watched, and saving it applies the
# new settings straight away — no restart, no reload_config keybind.
# An automatic reload never writes the file back, so your comments and
# ordering survive. Set false to reload only on demand (the
# reload_config action, or `kill -USR1 $(pidof sketerm)`).
# config_auto_reload     = true

# Auto shell-integration: zsh/fish get OSC 7 cwd + OSC 133 command
# marks injected at spawn (ZDOTDIR / XDG_DATA_DIRS shims, no rc
# edits). bash still needs the manual source line. Set off if you
# manage the scripts yourself (manual sourcing stays harmless —
# the scripts are idempotent).
# shell_integration      = auto        # auto | off

# Color scheme + palette
# scheme = solarized_dark             # tango / linux / xterm / solarized_dark/light /
#                                     # gruvbox_dark/light / nord / dracula / monokai
# palette = #000000:#cc0000:#4e9a06:#c4a000:#3465a4:#75507b:#06989a:#d3d7cf:#555753:#ef2929:#8ae234:#fce94f:#729fcf:#ad7fa8:#34e2e2:#eeeeec

# Background image / gradient (drawn behind the cell grid; cells
# with an explicit bg still paint over it).
# background_image          = /home/me/wallpaper.png   # cover-cropped
# background_image_opacity  = 0.3        # keep low, text sits on it
# Gradient activates when both colours are set (image wins if both):
# background_gradient_from  = #1a1a2e
# background_gradient_to    = #16213e
# background_gradient_angle = 90         # 0 = left>right, 90 = top>bottom

# Custom post-process shader (shadertoy-style GLSL file defining
# `void mainImage(out vec4 fragColor, in vec2 fragCoord)`; sample the
# rendered terminal via iChannel0, plus iResolution/iTime/iTimeDelta/
# iFrame). Compile errors disable the pass; the terminal keeps
# rendering normally. Animation redraws every frame — costs GPU.
# Shipped CRT shaders (see /usr/share/sketerm/shaders/README for
# per-file licensing):
#   crt.glsl          — the full retro engine: phosphor colorization
#                       (color picker; colorize 0 = keep colors),
#                       scanlines, curvature, glow, chromatic
#                       aberration, static noise, sync jitter,
#                       persistence trails, flicker.
#   crt-lottes.glsl   — Timothy Lottes' public-domain classic
#                       (gaussian beam, shadow mask, warp).
#   crt-easymode.glsl — EasyMode's flat CRT (RetroArch port, GPL).
#   zfast-crt.glsl    — Greg Hogan's fast CRT (RetroArch port, GPL).
# custom_shader           = /usr/share/sketerm/shaders/crt.glsl
# custom_shader_animation = true   # flicker/noise/jitter/trails live
#
# Shaders expose tunable knobs declared in the GLSL file — RetroArch
# `#pragma parameter name "Label" default min max step` lines plus
# sketerm's //@color (vec3), //@name and //@desc. Shaders can also
# load extra textures (LUTs, masks, grain):
#   //@texture <uniform> <path|builtin:noise>
# Paths resolve relative to the shader file (PNG/JPEG/BMP);
# builtin:noise is a generated 256x256 noise tile. The easy way to
# tune them: right-click a pane using the shader > "Configure
# Shader…" — live sliders, a color picker and an animated preview
# (writes the values below). Manual overrides work too — applied
# LIVE on config reload (SIGUSR1 or prefs), no recompile:
# shader_param.colorize  = 1.0           # 0 = original colors
# shader_param.phosphor  = #ffb333       # amber; #40ff59 = green
# shader_param.glow      = 0.55
# shader_param.scanlines = 0.22
# shader_param.curvature = 0.06          # 0 = flat screen
# shader_param.vignette  = 0.28
# shader_param.flicker   = 0.015
# shader_param.chroma    = 0.0           # chromatic aberration
# shader_param.noise     = 0.0           # static noise
# shader_param.jitter    = 0.0           # horizontal sync wobble
# shader_param.persistence = 0.45        # phosphor afterglow trails
#                                        # (turn animation on for a
#                                        # smooth decay)
