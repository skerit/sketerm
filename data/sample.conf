# sketerm sample config — copy to ~/.config/sketerm/config.conf
# Format: key = value, one per line. `#` at line start = comment.
# Hex colors (#RRGGBB or #RRGGBBAA) are supported as values.

# Font
# font           = /usr/share/fonts/Hack/Hack-Regular.ttf
# font_size      = 14
# Extra pixels per cell row for line spacing. 0 = font's natural
# metric. Negative tightens; clamped so glyphs still fit. Useful
# for fonts that feel cramped (e.g. add 2-4 px) or to maximise
# vertical density on small screens.
# line_pad_px    = 0
# OpenType features for shaping, space/comma separated. CSS/kitty
# syntax: +feat enables, -feat disables, feat=N selects alternates.
# e.g. disable ligatures' calt but keep a stylistic set:
# font_features  = -calt +ss01 zero

# Colors
# default_fg     = #eaeaea
# default_bg     = #1a1a1a
# cursor_color   = #ffffff

# Cursor: shape = block | underline | bar
# cursor_shape   = block
# cursor_blink   = true
# Half-cycle in ms (full blink = 2 × this). xterm default 500.
# cursor_blink_ms = 500

# Layout
# padding        = 6.0
# scrollback     = 10000

# Shell + child env
# shell          = /usr/bin/fish
# term           = xterm-256color
# color_term     = truecolor
#
# For tools that gate image preview on $TERM (yazi, lf, btop, chafa,
# viu, neofetch, etc.), set:
#   term = xterm-kitty
# This makes them use the Kitty graphics protocol — sketerm supports
# it natively. Sixel users keep the default (xterm-256color); DA1
# advertises sixel and most sixel-aware tools accept that.

# Behaviour
# bracketed_paste    = true
# modify_other_keys  = 0   # 0 = off, 1 = basic, 2 = full

# Rendering
# ligatures          = true   # HarfBuzz shaping for Fira Code etc.
# bidi               = true   # Hebrew/Arabic/Indic via fribidi (LTR
                              # rows skip the bidi cost automatically)
# auto_theme         = true   # follow Adwaita dark/light at runtime

# Bell
# bell_audible       = false  # add a system beep on BEL/notify
# bell_visible       = true   # flash the cell briefly on BEL
# bell_urgent        = true   # mark non-focused tabs needs-attention

# Window
# tab_position           = top         # top | bottom
# close_button_on_tab    = true
# always_on_top          = false       # gtk_window_set_keep_above
# new_tab_after_current  = false       # insert new tabs after focused vs. at end
# confirm_close          = multiple    # never | multiple | always

# Mouse
# mouse_autohide          = true       # hide cursor while typing
# copy_on_selection       = false      # copy to PRIMARY on selection-end
# clear_select_on_copy    = false      # drop selection after Ctrl+Shift+C
# disable_mouse_paste     = false      # disable middle-click paste
# disable_mousewheel_zoom = false      # don't let Ctrl+wheel resize font
# link_single_click       = false      # OSC 8 links open without Ctrl
# Rebindable click actions (when apps aren't capturing the mouse).
# Values: menu | paste_primary | paste_clipboard | none
# mouse_middle_click      = paste_primary
# mouse_right_click       = menu        # PuTTY-style: paste_clipboard
#
# Keyboard hints (Ctrl+Shift+E): activating a path hint whose file
# exists locally opens it in an editor at the right line (compiler
# errors -> editor in one keystroke). Either a {file}/{line}/{col}
# template or a bare command that takes `+line file`. Unset =
# $EDITOR/$VISUAL; no editor at all = copy to clipboard as before.
# hint_editor             = nvim
# hint_editor             = code -g {file}:{line}:{col}
#
# Inside a tmux/vim/htop session that has mouse-tracking on, sketerm
# forwards every click to the running app — that's why drag-select
# does nothing. Hold Shift while dragging to override (xterm/kitty
# convention). Ctrl+Shift+A copies the entire visible screen if the
# app won't let go of the mouse at all.

# Clipboard over mosh + tmux (OSC 52)
# OSC 52 is the escape sequence apps use to put text on YOUR system
# clipboard from inside a remote session. Two stacked filters can
# silently drop it:
#   1. tmux only emits OSC 52 to the outer terminal when it believes
#      the outer terminal supports it. sketerm's default $TERM is
#      xterm-256color, which doesn't advertise the `Ms` cap. Add to
#      your ~/.tmux.conf:
#          set -as terminal-features ',*:clipboard'
#      (tmux ≥ 3.2). Older tmux: `set-option -ag terminal-overrides
#      ',*:Ms=\\E]52;%p1%s;%p2%s\\007'`.
#   2. mosh strips most OSC sequences. Recent mosh (≥ 1.4) supports
#      OSC 52 but only with `MOSH_OSC52=1` set on the *server* side
#      before mosh-server starts (e.g. via your shell rc), or with a
#      build that has it on by default. `mosh --version` will tell
#      you. Without this, no terminal will ever see OSC 52 from
#      inside a mosh session — sketerm receives nothing to forward.
#
# OSC 52 READ queries (an app asking for your clipboard contents)
# are denied by default: anything running on the PTY — including
# remote programs over ssh — could silently exfiltrate whatever you
# last copied. Enable only if you use a tool that needs it (e.g.
# vim's clipboard=unnamed over ssh):
# clipboard_read          = allow      # default: deny

# Search
# search_case_sensitive   = false      # default for the search box

# Bold rendering
# allow_bold              = true       # honour bold attr at all
# bold_is_bright          = true       # bold lifts palette 0..7 to 8..15

# Custom keybindings
# Override the default action ↔ accelerator mapping per action. Empty
# value unbinds. Action names are stable; format is GTK accelerator
# style. Stack modifiers in any order. See defaults below for the
# full list of action names. (You can also rebind via the prefs UI.)
# keybind.new_tab               = <Control><Shift>t
# keybind.close_tab             = <Control><Shift>w
# keybind.split_h               = <Control><Shift>d
# keybind.split_v               = <Control><Shift>r
# keybind.search_open           = <Control><Shift>f
# keybind.paste_clipboard       = <Control><Shift>v
# keybind.copy_screen           = <Control><Shift>a
# keybind.interrupt_or_copy     = <Control><Shift>c
# keybind.clear_and_scrollback  = <Control><Shift>k
# keybind.save_layout           = <Control><Shift>s
# keybind.save_layout_as        = <Control><Shift><Alt>s
# keybind.save_default_layout   =
# Saves to $XDG_STATE_HOME/sketerm/default.json. Auto-loaded on
# every cold start when neither --layout nor --restore is given.
# keybind.toggle_pin_tab        = <Control><Shift>p
# keybind.toggle_tab_bar        =
# Show / hide the tab bar entirely. Useful when running with a
# single tab — the bar's vertical space goes back to content.
# keybind.reload_config         =
# Re-read this file from disk + apply live (no restart needed).
# Honours the XDG search path; --config <path> overrides aren't
# re-honoured. Useful while iterating on theme / palette tweaks.
# keybind.prompt_prev           = <Control><Shift>Up
# keybind.prompt_next           = <Control><Shift>Down
# keybind.pane_prev             = <Control><Shift>Left
# keybind.pane_next             = <Control><Shift>Right
# keybind.next_tab              = <Control>Tab
# keybind.prev_tab              = <Control><Shift>Tab
# keybind.font_inc              = <Control>plus
# keybind.font_dec              = <Control>minus
# keybind.font_reset            = <Control>0
# keybind.prefs_open            = <Control>comma
# keybind.scrollback_page_up    = <Shift>Page_Up
# keybind.scrollback_page_down  = <Shift>Page_Down
# keybind.scrollback_top        = <Control><Shift>Home
# keybind.scrollback_bottom     = <Control><Shift>End
# keybind.broadcast_cycle       = <Control><Shift>g
# keybind.restore_closed_tab    = <Control><Shift>z
# keybind.duplicate_tab         =
# Spawn a new tab inheriting the focused pane's cwd + active profile.
# Multi-pane tabs round-trip through the layout-spec pipeline so
# splits are preserved.
# keybind.copy_selection        =
# keybind.copy_scrollback       =
# Like copy_screen, but extracts the entire scrollback ring + active
# screen. Soft-wraps preserved as logical lines.
# keybind.clear_scrollback      =
# Wipe the scrollback ring without disturbing the visible screen
# (vs. clear_and_scrollback which clears both).
# keybind.copy                  = (no default — usually use interrupt_or_copy)
# keybind.paste                 = (no default — usually use paste_clipboard)

# Profiles
# Each `[profile.<name>]` section overrides per-pane fields for panes
# spawned with that profile. Splits inherit the focused pane's profile.
# `default_profile` selects the profile used by the FIRST pane on
# startup; empty string = no default (use global config).
# default_profile = dev
#
# [profile.dev]
# shell = /usr/bin/fish
# scheme = solarized_dark
# font_size = 14
# scrollback = 50000
#
# [profile.prod]
# shell = /usr/bin/bash
# login_shell = true
# term = xterm-256color
# scheme = monokai

# Mux domains
# Each `[domain.<name>]` section names a remote sketerm-mux endpoint.
# The command palette gains a "New Tab on <name>" entry, and
# `sketerm mux <name>` / `sketerm ssh <name>` resolve the name.
# transport: ssh (default) tunnels over the SSH pipe; udp does a
# one-time SSH bootstrap then mosh-style encrypted datagrams
# (roams across network changes, lower latency).
#
# [domain.devbox]
# host = skerit@192.168.1.2
# transport = udp
#
# [domain.work]
# host = build.example.com

# UDP transport port range (mosh-style; pin when a firewall sits in
# front of the remote host and open these ports for UDP):
# mux_udp_port_range = 60000:61000

# URL auto-detection
# auto_url_detect         = true       # underline plain http(s) URLs

# Window background opacity
# 1.0 = fully opaque (default). Lower values let the compositor blend
# behind the window. Wayland-only; X11 ignores. Blur is the user's
# job via compositor window rules (KWin / Mutter Tweaks).
# background_opacity      = 1.0

# Inactive pane dimming
# When you have multiple split panes, only the focused one runs at
# full brightness; others get their fg/bg multiplied by these
# factors. Defaults match Terminator (fg dimmed to 80%, bg untouched).
# inactive_fg_dim         = 0.8        # foreground multiplier (0..1)
# inactive_bg_dim         = 1.0        # background multiplier (0..1)

# Minimum text contrast
# Enforce a minimum WCAG contrast ratio (1..21) between text and its
# cell background; text below it snaps to white or black. Rescues
# unreadable color combos some TUIs emit. 1.0 = off.
# minimum_contrast        = 1.0

# Per-pane title bar (Terminator-style)
# show_titlebar           = false      # show OSC 0/1/2 title above each pane
# show_tab_bar            = true       # AdwTabBar above the panes — set
                                       # false to start with the bar hidden;
                                       # toggle_tab_bar action flips runtime
# title_active_fg         = #ffffff    # active pane: foreground
# title_active_bg         = #c80003    # active pane: background (red)
# title_inactive_fg       = #000000    # other panes: foreground
# title_inactive_bg       = #c0bebf    # other panes: background (grey)

# Behaviour extras
# scroll_on_output       = false       # snap to bottom on any output
# smart_copy             = true        # Ctrl+Shift+C with no selection forwards Ctrl+C
# login_shell            = false       # prepend `-` to argv[0]
# cursor_color_default   = true        # cursor uses fg color (ignore cursor_color)
# word_chars             = -_.,/?:@&=+%~
# exit_action            = close       # close | restart | hold

# Color scheme + palette
# scheme = solarized_dark             # tango / linux / xterm / solarized_dark/light /
#                                     # gruvbox_dark/light / nord / dracula / monokai
# palette = #000000:#cc0000:#4e9a06:#c4a000:#3465a4:#75507b:#06989a:#d3d7cf:#555753:#ef2929:#8ae234:#fce94f:#729fcf:#ad7fa8:#34e2e2:#eeeeec

# Background image / gradient (drawn behind the cell grid; cells
# with an explicit bg still paint over it).
# background_image          = /home/me/wallpaper.png   # cover-cropped
# background_image_opacity  = 0.3        # keep low, text sits on it
# Gradient activates when both colours are set (image wins if both):
# background_gradient_from  = #1a1a2e
# background_gradient_to    = #16213e
# background_gradient_angle = 90         # 0 = left>right, 90 = top>bottom
